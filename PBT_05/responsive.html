<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="hamburger">☰</div>
        <h1 class="logo">ShopHub</h1>
        <nav class="nav-links">
            <a href="#home">Trang chủ</a>
            <a href="#products">Sản phẩm</a>
            <a href="#about">Giới thiệu</a>
            <a href="#contact">Liên hệ</a>

        <div class="cart-icon">🛒</div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar Filter -->
        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <div class="filter-group">
                <label><input type="checkbox"> Giày dép</label>
                <label><input type="checkbox"> Áo quần</label>
                <label><input type="checkbox"> Phụ kiện</label>
            </div>
            <div class="filter-group">
                <h4>Giá</h4>
                <label><input type="checkbox"> Dưới 100K</label>
                <label><input type="checkbox"> 100K - 500K</label>
                <label><input type="checkbox"> Trên 500K</label>
            </div>
        </aside>
