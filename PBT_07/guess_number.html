<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đoán Số</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 400px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .game-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .game-info p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .attempts {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #764ba2;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .guess-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .guess-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .guess-btn:active {
            transform: translateY(0);
        }
        
        .reset-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .reset-btn:hover {
            background: #e0e0e0;
        }
        
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            min-height: 24px;
            font-size: 15px;
        }
        
        .info-message {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        
        .success-message {
            background: #c8e6c9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        
        .error-message {
            background: #ffcdd2;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        
        .warning-message {
            background: #fff9c4;
            color: #f57f17;
            border-left: 4px solid #f57f17;
        }
        
        .history-message {
            background: #f5f5f5;
            color: #666;
            border-left: 4px solid #999;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Đoán Số</h1>
        <p class="subtitle">Đoán số từ 1 đến 100</p>
        
        <div class="game-info">
            <p>Máy sẽ random 1 số từ 1-100</p>
            <p>Bạn có <span class="attempts" id="attempts">7</span> lần đoán</p>
        </div>
        
        <input type="number" id="guessInput" placeholder="Nhập số (1-100)" min="1" max="100">
        
        <div class="button-group">
            <button class="guess-btn" onclick="makeGuess()">Đoán</button>
            <button class="reset-btn" onclick="resetGame()">Chơi lại</button>
        </div>
        
        <div class="message" id="message"></div>
        <div class="message history-message" id="historyMessage"></div>
    </div>
    
    <script src="guess.js"></script>
</body>
</html>
